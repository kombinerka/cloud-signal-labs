# Reusable deploy job: downloads the artifact built once and deploys it to one environment.
name: deploy

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      version:
        type: string
        required: true

permissions:
  contents: read
  id-token: write # for OIDC sign-in to your cloud in the real deploy step, see ../../../../oidc-deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    defaults:
      run:
        working-directory: cicd-pipeline
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: shop
          path: cicd-pipeline/dist/
      - run: ./deploy.sh ${{ inputs.environment }} dist/shop-${{ inputs.version }}.tar.gz
