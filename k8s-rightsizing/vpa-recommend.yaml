# Vertical Pod Autoscaler in recommendation mode: it watches real usage and suggests requests,
# but never changes or restarts pods ("Off"). Needs the VPA components installed (AKS: --enable-vpa).
#   kubectl describe vpa web-recommender     -> Status: Recommendation: Target / Lower Bound / Upper Bound
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: web-recommender
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: web
  updatePolicy:
    updateMode: "Off"
