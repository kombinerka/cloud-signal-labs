# AZ-401 episode 6 - publish an npm package to GitHub Packages when a release is published.
# Fictional org "pinecone-gear". The built-in GITHUB_TOKEN publishes for this repository only.
name: Publish package

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '20.x'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@pinecone-gear'
      - run: npm ci
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
