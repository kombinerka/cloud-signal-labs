# Deploy to Azure with OIDC: no client secret anywhere.
# Repository variables: AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID (IDs, not secrets).
name: deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write # lets the job request a GitHub OIDC token; without it azure/login fails

jobs:
  deploy:
    runs-on: ubuntu-latest
    # The environment makes the token's subject repo:<owner>/<repo>:environment:production,
    # which is exactly what the federated credential trusts. Add required reviewers to the environment
    # and Azure only ever sees jobs that passed that approval.
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - run: az group show -n rg-app-prod --query name -o tsv # replace with your deployment
