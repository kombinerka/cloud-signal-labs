# azure-pipelines.yml (fictional Pinecone project). Validated as YAML, not run.
# The service connection "pinecone-prod" uses workload identity federation.
# Its Issuer and Subject identifier are generated by Azure DevOps: copy them into the
# federated credential (pipelinesIssuer / pipelinesSubject in main.bicep), never type them.
trigger:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

steps:
  - task: AzureCLI@2
    displayName: Who am I?
    inputs:
      azureSubscription: pinecone-prod
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        az account show --query "{user: user.name, type: user.type}" -o table
