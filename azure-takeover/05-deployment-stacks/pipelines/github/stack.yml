# Pull request: PSRule checks the Bicep (your tests). Push to main: deploy the stack.
# Copy to .github/workflows/ in the repo that holds the Bicep. Repository variables: AZURE_CLIENT_ID,
# AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID, BREAK_GLASS_GROUP_ID. OIDC setup: ../../../../oidc-deploy
name: stack

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: microsoft/ps-rule@46451b8f5258c41beb5ae69ed7190ccbba84112c # v2.9.0
        with:
          modules: PSRule.Rules.Azure
          inputPath: azure-takeover/05-deployment-stacks/

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - run: ./azure-takeover/05-deployment-stacks/deploy-stack.sh
        env:
          RG: rg-app-dev
          BREAK_GLASS_GROUP_ID: ${{ vars.BREAK_GLASS_GROUP_ID }}
