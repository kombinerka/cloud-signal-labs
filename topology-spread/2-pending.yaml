# Two HARD spreading rules (DoNotSchedule).
#   zone rule:  zone A has 3, zone B has 2 -> only zone B keeps skew <= 1 -> only node 3
#   node rule:  nodes have 2, 1, 2       -> only node 2 keeps skew <= 1
# The scheduler needs a node that passes both. The intersection is empty: the Pod stays Pending.
apiVersion: v1
kind: Pod
metadata:
  name: web-6
  labels: { app: web }
spec:
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: DoNotSchedule
      labelSelector: { matchLabels: { app: web } }
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      nodeTaintsPolicy: Honor # skip the tainted kind control-plane node, so the domains are the 3 workers
      whenUnsatisfiable: DoNotSchedule
      labelSelector: { matchLabels: { app: web } }
  containers:
    - name: web
      image: registry.k8s.io/pause:3.10
