# The starting point from the video: 5 matching Pods, placed directly (nodeName skips the scheduler).
# Per node: 2, 1, 2.  Per zone: A = 3, B = 2.
apiVersion: v1
kind: Pod
metadata: { name: web-1, labels: { app: web } }
spec: { nodeName: spread-worker, containers: [{ name: web, image: registry.k8s.io/pause:3.10 }] }
