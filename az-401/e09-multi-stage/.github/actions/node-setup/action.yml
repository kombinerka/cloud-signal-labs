# Composite action: a bundle of steps that runs as ONE step in a job.
name: Node setup
description: Install Node.js and the shop's npm dependencies
inputs:
  node-version:
    description: Node.js version
    required: false
    default: '22'
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm
    - run: npm ci
      shell: bash
