# Pinecone shop: read a Key Vault secret in GitHub Actions without storing it.
name: deploy-with-keyvault

on:
  push:
    branches: [main]

permissions:
  id-token: write   # OIDC sign-in, no client secret
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production   # environment secrets wait for required reviewers
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Read secret from Key Vault
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript: |
            STORAGE_KEY=$(az keyvault secret show --name storage-key \
              --vault-name kv-pinecone-shop --query value -o tsv)
            echo "::add-mask::$STORAGE_KEY"
            echo "STORAGE_KEY=$STORAGE_KEY" >> "$GITHUB_ENV"

      - name: Deploy
        run: ./deploy.sh   # reads STORAGE_KEY from the environment, never echoes it
