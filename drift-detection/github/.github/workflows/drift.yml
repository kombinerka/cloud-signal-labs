# Nightly drift check. Fails (and opens an issue) when the real resources differ from the code.
# Works for both: TOOL=terraform runs terraform plan, TOOL=bicep runs what-if against RG.
# Repository variables: AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID (IDs, not secrets).
# The identity needs a federated credential for this repo's main branch and Reader on the resources.
name: drift

on:
  schedule:
    - cron: "17 5 * * *" # daily, 05:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC token for Azure
  issues: write # open an issue on drift

env:
  TOOL: terraform # or: bicep
  RG: rg-network-prod # used by the bicep check

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      ARM_USE_OIDC: "true" # terraform: sign in with the GitHub OIDC token
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - if: env.TOOL == 'terraform'
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.5
          terraform_wrapper: false # keep terraform's real exit code

      - if: env.TOOL == 'bicep'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Check for drift
        id: check
        run: |
          set +e
          "drift-detection/$TOOL/drift-check.sh" > result.txt 2>&1
          code=$?
          cat result.txt
          echo "exitcode=$code" >> "$GITHUB_OUTPUT"
          [ "$code" = 1 ] && exit 1 || exit 0

      - name: Open an issue on drift
        if: steps.check.outputs.exitcode == '2'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "The nightly $TOOL check found differences between Azure and the code."
            echo
            echo '```'
            grep -E '^\s*[~+-]|Plan:|^(Create|Delete|Modify|Deploy)|^    ' result.txt | head -100
            echo '```'
            echo
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } > body.md
          gh issue create --title "Drift detected $(date -u +%F)" --body-file body.md
          exit 1
