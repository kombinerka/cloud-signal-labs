# AZ-401 episode 8 - workflow_run: start after the "CI" workflow runs on main.
name: After CI

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  report:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - run: echo "CI succeeded for ${{ github.event.workflow_run.head_sha }}"
