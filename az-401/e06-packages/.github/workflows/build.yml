# AZ-401 episode 6 - version a workflow artifact with the run number.
# github.run_number grows with every new run of this workflow; a re-run keeps the same number.
name: Build trail-ui

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '20.x'
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: trail-ui-${{ github.run_number }}
          path: dist/
          retention-days: 30
